<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <h1>SKY SCAN 🌤️</h1>
      <p class="note">
       <b> <i>Enter a city name to see the current weather.</i></b>
      </p>

      <div class="form-group">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name (e.g. London)"
        />
        <button id="searchBtn">Get Weather</button>
      </div>

      

      <div id="message" class="message"></div>

      <div id="weatherResult" class="weather-card hidden">
        <h2 id="cityName"></h2>
        <p id="dateText" class="date-text"></p>
        <div class="weather-main">
          <img id="weatherIcon" alt="Weather icon" class="weather-icon" />
          <div>
            <p id="temperature" class="temperature"></p>
            <p id="description" class="description"></p>
          </div>
        </div>
        <div class="extra-info">
          <p>💧 Humidity: <span id="humidity"></span>%</p>
          <p>💨 Wind: <span id="wind"></span> m/s</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
